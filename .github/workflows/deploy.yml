name: deploy

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build bootJars (skip tests)
        run: |
          ./gradlew --no-daemon :blendit-api:bootJar :blendit-chat:bootJar -x test

      - name: Resolve JAR paths
        id: jars
        shell: bash
        run: |
          API_JAR="$(ls -1 blendit-api/build/libs/*.jar | grep -v 'plain' | head -n 1)"
          CHAT_JAR="$(ls -1 blendit-chat/build/libs/*.jar | grep -v 'plain' | head -n 1)"

          if [[ -z "$API_JAR" || -z "$CHAT_JAR" ]]; then
            echo "ERROR: jar not found"
            echo "API_JAR=$API_JAR"
            echo "CHAT_JAR=$CHAT_JAR"
            ls -al blendit-api/build/libs || true
            ls -al blendit-chat/build/libs || true
            exit 1
          fi

          echo "api_jar=$API_JAR" >> $GITHUB_OUTPUT
          echo "chat_jar=$CHAT_JAR" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to NCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCP_ACCESS_KEY }}
          password: ${{ secrets.NCP_SECRET_KEY }}

      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          platforms: linux/amd64
          build-args: |
            JAR_FILE=${{ steps.jars.outputs.api_jar }}
          tags: |
            ${{ secrets.NCR_REGISTRY }}/blendit-api:${{ github.sha }}
            ${{ secrets.NCR_REGISTRY }}/blendit-api:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push CHAT image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chat
          push: true
          platforms: linux/amd64
          build-args: |
            JAR_FILE=${{ steps.jars.outputs.chat_jar }}
          tags: |
            ${{ secrets.NCR_REGISTRY }}/blendit-chat:${{ github.sha }}
            ${{ secrets.NCR_REGISTRY }}/blendit-chat:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
