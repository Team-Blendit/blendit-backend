name: api-ci-and-deploy

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build API (skip tests)
        run: ./gradlew --no-daemon :blendit-api:build -x test

      - name: Build bootJar (skip tests)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: ./gradlew --no-daemon :blendit-api:bootJar -x test

      - name: Upload deploy artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: blendit-api-jar
          path: blendit-api/build/libs/*.jar
          if-no-files-found: error

  deploy_api:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build_api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: blendit-api-jar
          path: blendit-api/build/libs

      - name: Resolve deploy variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          JAR_PATH="$(ls -1 blendit-api/build/libs/*.jar | grep -v 'plain' | head -n 1)"
          if [[ -z "${JAR_PATH}" ]]; then
            echo "Executable jar not found"
            exit 1
          fi

          PORT="${{ secrets.LIGHTSAIL_PORT }}"
          if [[ -z "${PORT}" ]]; then
            PORT="22"
          fi

          echo "jar_path=${JAR_PATH}" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "release_id=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "remote_jar=/tmp/blendit-api-${GITHUB_SHA}.jar" >> "$GITHUB_OUTPUT"
          echo "remote_script=/tmp/deploy_lightsail.sh" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}" > ~/.ssh/id_lightsail
          chmod 600 ~/.ssh/id_lightsail
          ssh-keyscan -p "${{ steps.vars.outputs.port }}" "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload artifact and deploy script
        shell: bash
        run: |
          set -euo pipefail

          scp -i ~/.ssh/id_lightsail -P "${{ steps.vars.outputs.port }}" \
            "${{ steps.vars.outputs.jar_path }}" \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ steps.vars.outputs.remote_jar }}"

          scp -i ~/.ssh/id_lightsail -P "${{ steps.vars.outputs.port }}" \
            scripts/deploy_lightsail.sh \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ steps.vars.outputs.remote_script }}"

      - name: Restart service on Lightsail
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_lightsail -p "${{ steps.vars.outputs.port }}" \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "chmod +x '${{ steps.vars.outputs.remote_script }}' && APP_ROOT=/home/ubuntu/app SERVICE_NAME=blendit-api '${{ steps.vars.outputs.remote_script }}' '${{ steps.vars.outputs.release_id }}' '${{ steps.vars.outputs.remote_jar }}'"
