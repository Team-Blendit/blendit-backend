spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: blendit
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss
      time: HH:mm:ss
  main:
    allow-bean-definition-overriding: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 200
        page-parameter: page

jwt:
  token:
    secret-key: ${JWT_SECRET_KEY:e6c02391cc71b0518fa50e01a454401f23f117d74fc591091564a898613b893f}
    exp-minute-time: 60
    refresh-exp-minute-time: 20160
    issuer: blendit-api

springdoc:
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /docs/swagger

security:
  public-endpoints:
    - path: /api/blendit/auth/**
      methods: ["*"]
    - path: /api/blendit/public/**
      methods: ["*"]
    - path: /api/blendit/blending/**
      methods: ["GET"]

oidc:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:your-kakao-client-id}
    client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/oidc/kakao}
    token-uri: https://kauth.kakao.com/oauth/token
    jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
    issuer: https://kauth.kakao.com
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/oidc/google}
    token-uri: https://oauth2.googleapis.com/token
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    issuer: https://accounts.google.com
